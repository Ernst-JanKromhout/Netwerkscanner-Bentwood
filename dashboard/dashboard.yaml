# Dashboard voor de netwerkscanner.
# Instellingen → Dashboards → Dashboard toevoegen → Nieuw dashboard vanaf nul, naam "Netwerk".
# Open het, klik op het potlood → ⋮ → Ruwe configuratie-editor, vervang alles door deze tekst en sla op.
views:
- title: Overzicht
  path: overzicht
  icon: mdi:lan
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Te beoordelen
      icon: mdi:shield-search
    - type: tile
      entity: sensor.netwerkscanner_te_beoordelen
      name: Openstaand
      grid_options:
        columns: 12
    - type: entities
      entities:
      - entity: input_select.netwerkscanner_te_beoordelen
        name: Apparaat
      grid_options:
        columns: 12
    - type: button
      name: Goedkeuren
      icon: mdi:check-circle
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.netwerkscanner_goedkeuren
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Afkeuren
      icon: mdi:close-circle
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.netwerkscanner_afkeuren
      grid_options:
        columns: 6
        rows: 2
    - type: button
      name: Alle openstaande goedkeuren
      icon: mdi:check-all
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.netwerkscanner_alles_goedkeuren
        confirmation:
          text: Alle openstaande apparaten goedkeuren?
      grid_options:
        columns: 12
        rows: 1
    - type: heading
      heading: Nu
      icon: mdi:lan
    - type: tile
      entity: sensor.netwerkscanner_apparaten_online
      name: Online
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.netwerkscanner_gebeurtenissen_vandaag
      name: Wijzigingen vandaag
      grid_options:
        columns: 6
    - type: history-graph
      title: Apparaten online, laatste 24 uur
      hours_to_show: 24
      entities:
      - entity: sensor.netwerkscanner_apparaten_online
        name: Online
      grid_options:
        columns: 12
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Apparaten
      icon: mdi:devices
    - type: markdown
      grid_options:
        columns: full
      content: |
        ✅ goedgekeurd · ⚠️ te beoordelen · ❌ afgekeurd · 💤 offline

        {% set ds = state_attr('sensor.netwerkscanner_apparaten', 'apparaten') or [] %}{% if ds %}| | Naam | IP | Open poorten | Laatst gezien |
        |---|---|---|---|---|
        {% for d in ds %}| {{ '❌' if d.status == 'afgekeurd' else ('✅' if d.status == 'goedgekeurd' else '⚠️') }}{{ '' if d.online else ' 💤' }} | {{ d.naam }} | {{ d.ip }} | {{ d.poorten | join(', ') if d.poorten else ('geen' if d.gescand else 'nog niet gescand') }} | {{ d.laatst_gezien }} |
        {% endfor %}{% else %}*Nog geen gegevens.*{% endif %}
    - type: heading
      heading: Laatste wijzigingen
      icon: mdi:history
    - type: markdown
      grid_options:
        columns: full
      content: |
        {% set ws = state_attr('sensor.netwerkscanner_laatste_wijzigingen', 'wijzigingen') or [] %}{% if ws %}| Tijd | Soort | Wat |
        |---|---|---|
        {% for w in ws %}| {{ w.tijd }} | {{ w.soort }} | {{ w.tekst }} |
        {% endfor %}{% else %}*Nog geen wijzigingen.*{% endif %}
